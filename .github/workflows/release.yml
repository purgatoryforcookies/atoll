# to release: scripts/release.sh patch|minor|major
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Path filters ignore tags, so a docs-only tag is caught by diffing against the previous one.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -n "$prev" ] && ! git diff --name-only "$prev" "$GITHUB_SHA" | grep -Eqv '(\.md$|^docs/)'; then
            echo "Only docs changed since $prev; skipping the release."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        # full history, so the push to main below can see it is a fast-forward
        with:
          fetch-depth: 0
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 #v2.9.3

      - name: Import the Developer ID certificate
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          KC_PASSWORD=$(uuidgen)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign
        env:
          UNIVERSAL: 1
          SIGN: Developer ID Application
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh dist/dmg/Atoll.app

      - name: Make the disk image
        run: |
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Atoll -srcfolder dist/dmg -format UDZO -ov "dist/Atoll-$VERSION.dmg"
          codesign --timestamp --sign "Developer ID Application" "dist/Atoll-$VERSION.dmg"

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "dist/Atoll-$VERSION.dmg" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "dist/Atoll-$VERSION.dmg"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # checkout can leave the tag lightweight; fetch the annotated one that carries the notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" "dist/Atoll-$VERSION.dmg" --title "Atoll $VERSION" --notes-from-tag

      # release.sh pushes only the tag; a push made with this token starts no other run, so CI doesn't repeat.
      - name: Move main to the release commit
        run: git push origin "$GITHUB_SHA:refs/heads/main"
