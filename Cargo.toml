[package]
name = "atoll"
version = "0.4.0"
edition = "2024"
license = "MIT"

[dependencies]
# Rune isn't on crates.io (the `rune` there is another crate); pinned to the commit
# that added `on_displays_changed` and kept a panel's click-through, on a fork until
# that lands in anomalyco/rune.
rune = { git = "https://github.com/purgatoryforcookies/rune", rev = "735ef2cddc404f01bb3c48d7e8a6677b7f8fe54f" }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
block2 = "0.5"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSGeometry", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.2.2", features = ["NSScreen"] }
