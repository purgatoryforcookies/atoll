[package]
name = "notch"
version = "0.0.1"
edition.workspace = true
license.workspace = true

[dependencies]
rune = { path = "../../crates/rune" }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[features]
# Live view edits through scripts/rune-dev.
hot = ["rune/hot"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
block2 = "0.5"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSGeometry", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.2.2", features = ["NSScreen"] }

[lints]
workspace = true
